name: Buildspace
description: Buildspace was an online education platform and community that billed itself as "the biggest
  school in the world for people who wanted to work on their own ideas," running six-week cohort-based
  programs to help entrepreneurs and builders ship their own projects and startups. Backed by a16z, the
  company wound down its operations; its site now serves only a farewell letter and final video. It was
  a consumer education and community product, not an API provider, and exposes no public developer surface,
  API, documentation, or SDKs. This profile is retained in the API Evangelist network as a portfolio lead.
